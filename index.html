<style>
  * { margin:0; padding:0; box-sizing:border-box; }

<script type="module">
import * as THREE from 'three';

const rand = (a,b) => Math.random()*(b-a)+a;
const randInt = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dist2 = (a,b) => (a.x-b.x)**2 + (a.z-b.z)**2;

// ==================== AUDIO ====================
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio(){ if(!actx){ try{ actx = new AC(); }catch(e){} } }
function beep(freq, dur=0.08, type='square', vol=0.06, slide=0){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime+dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}

// ==================== TEXTURAS ====================
function makeCanvasTexture(w, h, drawFn, repeat = 1){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'); drawFn(cx, w, h);
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repeat, repeat); tex.anisotropy = 4;
  return tex;
}
function makeGroundTexture(baseColor, accentColor, pattern = 'grass'){
  return makeCanvasTexture(256, 256, (c, w, h) => {
    c.fillStyle = baseColor; c.fillRect(0,0,w,h);
    const img = c.getImageData(0,0,w,h); const d = img.data;
    for(let i=0;i<d.length;i+=4){
      const n = (Math.random()-0.5)*30;
      d[i] = clamp(d[i]+n,0,255); d[i+1] = clamp(d[i+1]+n,0,255); d[i+2] = clamp(d[i+2]+n,0,255);
    }
    c.putImageData(img,0,0);
    if(pattern === 'grass'){
      c.strokeStyle = accentColor; c.lineWidth = 1.5;
      for(let i=0;i<180;i++){ const x = Math.random()*w, y = Math.random()*h; c.beginPath(); c.moveTo(x, y); c.lineTo(x + (Math.random()-0.5)*6, y - 4 - Math.random()*6); c.stroke(); }
    } else if(pattern === 'stone'){
      c.strokeStyle = accentColor; c.lineWidth = 2; for(let i=0;i<40;i++) c.strokeRect(Math.random()*w, Math.random()*h, rand(15,40), rand(15,40));
    } else if(pattern === 'sand'){
      for(let i=0;i<400;i++){ c.fillStyle = `rgba(${parseInt(accentColor.slice(1,3),16)},${parseInt(accentColor.slice(3,5),16)},${parseInt(accentColor.slice(5,7),16)},0.3)`; c.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
    } else if(pattern === 'snow'){
      for(let i=0;i<300;i++){ c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.arc(Math.random()*w, Math.random()*h, rand(1,3), 0, Math.PI*2); c.fill(); }
    }
  }, 12);
}
function makeSkinTexture(baseColor, variation = 20){
  return makeCanvasTexture(128, 128, (c, w, h) => {
    c.fillStyle = baseColor; c.fillRect(0,0,w,h);
    const img = c.getImageData(0,0,w,h); const d = img.data;
    for(let i=0;i<d.length;i+=4){ const n = (Math.random()-0.5)*variation; d[i] = clamp(d[i]+n,0,255); d[i+1] = clamp(d[i+1]+n,0,255); d[i+2] = clamp(d[i+2]+n,0,255); }
    c.putImageData(img,0,0);
    if(baseColor === '#8b5a2b'){ c.fillStyle = 'rgba(60,30,10,0.4)'; for(let i=0;i<100;i++){ c.beginPath(); c.arc(Math.random()*w, Math.random()*h, rand(1,2), 0, Math.PI*2); c.fill(); } }
  }, 2);
}
function makeWoodTexture(){
  return makeCanvasTexture(128, 128, (c, w, h) => {
    c.fillStyle = '#8b5a2b'; c.fillRect(0,0,w,h); c.strokeStyle = '#5a3a1a'; c.lineWidth = 1;
    for(let i=0;i<25;i++){ c.beginPath(); const y = Math.random()*h; c.moveTo(0, y); for(let x=0;x<w;x+=8) c.lineTo(x, y + Math.sin(x*0.1 + i)*2 + (Math.random()-0.5)*3); c.stroke(); }
    for(let i=0;i<3;i++){ c.fillStyle = '#4a2a10'; c.beginPath(); c.arc(Math.random()*w, Math.random()*h, rand(2,5), 0, Math.PI*2); c.fill(); }
  }, 1);
}
function makeScaleTexture(baseColor, accentColor){
  return makeCanvasTexture(128, 128, (c, w, h) => {
    c.fillStyle = baseColor; c.fillRect(0,0,w,h); const size = 12;
    for(let y=0; y<h; y+=size){
      const offset = (Math.floor(y/size)%2) * size/2;
      for(let x=-size; x<w; x+=size){ c.fillStyle = accentColor; c.beginPath(); c.arc(x+offset, y, size*0.55, 0, Math.PI*2); c.fill(); c.fillStyle = baseColor; c.beginPath(); c.arc(x+offset, y+2, size*0.5, 0, Math.PI*2); c.fill(); }
    }
  }, 2);
}
function makeArmorTexture(){
  return makeCanvasTexture(128, 128, (c, w, h) => {
    c.fillStyle = '#8899aa'; c.fillRect(0,0,w,h);
    for(let y=8; y<h; y+=24){ for(let x=8; x<w; x+=24){ c.fillStyle = '#ccddee'; c.beginPath(); c.arc(x, y, 3, 0, Math.PI*2); c.fill(); c.fillStyle = '#556677'; c.beginPath(); c.arc(x+1, y+1, 2, 0, Math.PI*2); c.fill(); } }
    const grad = c.createLinearGradient(0,0,w,h); grad.addColorStop(0,'rgba(255,255,255,0.15)'); grad.addColorStop(0.5,'rgba(255,255,255,0)'); grad.addColorStop(1,'rgba(0,0,0,0.2)'); c.fillStyle = grad; c.fillRect(0,0,w,h);
  }, 1);
}
function makeRobeTexture(color1, color2){
  return makeCanvasTexture(128, 128, (c, w, h) => {
    c.fillStyle = color1; c.fillRect(0,0,w,h);
    for(let i=0;i<40;i++){ c.fillStyle = color2; c.beginPath(); const x = Math.random()*w, y = Math.random()*h; const s = rand(1,3); c.moveTo(x, y-s); c.lineTo(x+s*0.3, y-s*0.3); c.lineTo(x+s, y); c.lineTo(x+s*0.3, y+s*0.3); c.lineTo(x, y+s); c.lineTo(x-s*0.3, y+s*0.3); c.lineTo(x-s, y); c.lineTo(x-s*0.3, y-s*0.3); c.closePath(); c.fill(); }
    const grad = c.createLinearGradient(0,0,0,h); grad.addColorStop(0,'rgba(255,255,255,0.1)'); grad.addColorStop(1,'rgba(0,0,0,0.2)'); c.fillStyle = grad; c.fillRect(0,0,w,h);
  }, 2);
}

const DIFFICULTIES = [

  { id:'knight', name:'Caballero', icon:'⚔️', desc:'Tanque acorazado.', color:'#8899aa', stats: { speed: 6.5, maxHp: 160, damage: 22, fireRate: 0.7, projSpeed: 20, projCount: 1, range: 16, magnet: 3.2, pierce: 1 }, statLabels: ['Tanque', 'Perforante'] },

// ==================== INIT 3D ====================
function initThree(){
  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 22, 16); camera.lookAt(0,0,0);
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  document.getElementById('wrap').insertBefore(renderer.domElement, document.getElementById('hud'));

  ambientLight = new THREE.AmbientLight(0x404060, 0.7); scene.add(ambientLight);
  hemiLight = new THREE.HemisphereLight(0x88aaff, 0x3a2010, 0.6); scene.add(hemiLight);
  dirLight = new THREE.DirectionalLight(0xffeedd, 1.3);
  dirLight.position.set(15, 25, 10); dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.left = -30; dirLight.shadow.camera.right = 30; dirLight.shadow.camera.top = 30; dirLight.shadow.camera.bottom = -30; dirLight.shadow.camera.near = 1; dirLight.shadow.camera.far = 80;
  scene.add(dirLight);
  scene.add(enemyGroup); scene.add(projGroup); scene.add(gemGroup); scene.add(partGroup); scene.add(chestGroup);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  });
  applyMapToScene(selectedMap);
}

function applyMapToScene(map){
  if(ground) scene.remove(ground); if(grid) scene.remove(grid); if(decorGroup) scene.remove(decorGroup); if(ambientParticles) scene.remove(ambientParticles);
  scene.background = new THREE.Color(map.skyColor); scene.fog = new THREE.Fog(map.fogColor, map.fogNear, map.fogFar);
  ambientLight.color.setHex(map.ambientColor); dirLight.color.setHex(map.lightColor); hemiLight.color.setHex(map.lightColor);

  const groundTex = makeGroundTexture(map.groundBase, map.groundAccent, map.groundPattern);
  const groundGeo = new THREE.PlaneGeometry(ARENA*2, ARENA*2);
  const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, color: map.groundColor, roughness: 0.95, metalness: 0.05 });
  ground = new THREE.Mesh(groundGeo, groundMat); ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

  const gridColor = map.id === 'snow' ? 0x88aacc : map.id === 'desert' ? 0x8a6a40 : map.id === 'castle' ? 0x4a3a6a : 0x3a5a3a;
  grid = new THREE.GridHelper(ARENA*2, 40, gridColor, gridColor); grid.position.y = 0.02; grid.material.opacity = 0.15; grid.material.transparent = true; scene.add(grid);

  decorGroup = new THREE.Group(); scene.add(decorGroup);
  const trunkTex = makeSkinTexture('#5a3a1a', 20); const leavesTex = makeSkinTexture(map.id === 'snow' ? '#3a5a4a' : '#2a8a3a', 30);

  for(let i=0;i<map.trees;i++){
    const x = rand(-ARENA*0.9, ARENA*0.9), z = rand(-ARENA*0.9, ARENA*0.9); if(Math.hypot(x,z) < 4) continue;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.22,1.2,6), new THREE.MeshStandardMaterial({ map: trunkTex, color: 0x5a3a1a, roughness:0.9 })); trunk.position.set(x, 0.6, z); trunk.castShadow = true; decorGroup.add(trunk);
    for(let lvl = 0; lvl < 3; lvl++){ const cone = new THREE.Mesh(new THREE.ConeGeometry(0.9 - lvl*0.2, 1.3, 6), new THREE.MeshStandardMaterial({ map: leavesTex, color: map.treeColor, roughness:0.8 })); cone.position.set(x, 1.5 + lvl*0.7, z); cone.castShadow = true; decorGroup.add(cone); }
  }
  for(let i=0;i<map.rocks;i++){
    const x = rand(-ARENA*0.9, ARENA*0.9), z = rand(-ARENA*0.9, ARENA*0.9); if(Math.hypot(x,z) < 4) continue;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.3,0.8), 0), new THREE.MeshStandardMaterial({ color: map.id === 'snow' ? 0xaabbcc : map.id === 'desert' ? 0xa08050 : 0x555566, roughness:0.9, flatShading:true })); rock.position.set(x, rand(0.2,0.5), z); rock.rotation.set(rand(0,Math.PI), rand(0,Math.PI), rand(0,Math.PI)); rock.castShadow = true; decorGroup.add(rock);
  }

  const pGeo = new THREE.BufferGeometry(); const pPts = [];
  for(let i=0;i<400;i++) pPts.push(rand(-60,60), rand(2,40), rand(-60,60));
  pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPts, 3));
  const pColor = map.id === 'snow' ? 0xffffff : map.id === 'desert' ? 0xffdd88 : map.id === 'castle' ? 0xaa88cc : 0xaaffaa;
  ambientParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color:pColor, size:0.15, transparent:true, opacity:0.4 })); scene.add(ambientParticles);
}

function createHealthBar(color = 0x44ff44){
  const group = new THREE.Group();
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.18), new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.7, depthTest:false })); bg.renderOrder = 999; group.add(bg);
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(1.34, 0.12), new THREE.MeshBasicMaterial({ color, transparent:true, depthTest:false })); fill.position.z = 0.01; fill.renderOrder = 1000; group.add(fill);
  scene.add(group); return { group, fill };
}
function updateHealthBar(hb, ratio){
  ratio = clamp(ratio, 0, 1); hb.fill.scale.x = ratio; hb.fill.position.x = -(1.34 * (1 - ratio)) / 2;
  if(ratio > 0.5) hb.fill.material.color.setHex(0x44ff44); else if(ratio > 0.25) hb.fill.material.color.setHex(0xffaa00); else hb.fill.material.color.setHex(0xff2222);
}

function createPlayer(character){
  let mesh;
  if(character.id === 'monkey') mesh = buildMonkeyModel();
  else if(character.id === 'knight') mesh = buildKnightModel();
  else if(character.id === 'dragon') mesh = buildDragonModel();
  else if(character.id === 'mage') mesh = buildMageModel();
  else mesh = buildMonkeyModel();

  const auraColor = character.id === 'monkey' ? 0xffd93d : character.id === 'knight' ? 0x88ddff : character.id === 'dragon' ? 0xff6633 : 0xaa66ff;
  const aura = new THREE.Mesh(new THREE.RingGeometry(0.8, 1.0, 32), new THREE.MeshBasicMaterial({ color:auraColor, transparent:true, opacity:0.35, side:THREE.DoubleSide }));
  aura.rotation.x = -Math.PI/2; aura.position.y = 0.05; mesh.add(aura);

  scene.add(mesh); const hb = createHealthBar(0x44ff44); const s = character.stats;
  return { mesh, aura, healthBar: hb, character, x: 0, z: 0, r: 0.7, speed: s.speed, hp: s.maxHp, maxHp: s.maxHp, fireRate: s.fireRate, fireCd: 0, damage: s.damage, projSpeed: s.projSpeed, projCount: s.projCount, projSize: 0.28, range: s.range, pierce: s.pierce, magnet: s.magnet, invuln: 0, walkPhase: 0 };
}

}

  const base = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 0.8), woodMat); base.position.y = 0.35; base.castShadow = true; g.add(base);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.25, 0.85), woodMat); lid.position.y = 0.82; lid.castShadow = true; g.add(lid);
  for(const dx of [-0.45, 0.45]){ const band = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.72, 0.85), goldMat); band.position.set(dx, 0.35, 0); g.add(band); }

  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 12), new THREE.MeshBasicMaterial({ color:0xffd93d, transparent:true, opacity:0.15, side:THREE.BackSide })); glow.position.y = 0.5; g.add(glow);
  g.position.set(x, 0, z); chestGroup.add(g);

}
function spawnChest(){
  let x, z, tries = 0;
  do { const ang = rand(0, Math.PI*2); const r = rand(6, ARENA*0.85); x = Math.cos(ang)*r; z = Math.sin(ang)*r; tries++; } while(player && Math.hypot(x-player.x, z-player.z) < 5 && tries < 20);
  chests.push(createChest(x, z)); beep(880, 0.1, 'sine', 0.04, 1100);
}
function openChest(chest){
  if(chest.open) return; chest.open = true; chest.openTimer = 0.5; chestsOpened++;
  spawnBurst(chest.x, 1, chest.z, 0xffd93d, 25, 8); spawnBurst(chest.x, 1, chest.z, 0xffaa00, 15, 6);
  const type = randInt(0, 3); let text = '', color = '#ffd93d';
  switch(type){
    case 0: player.hp = Math.min(player.hp + 40, player.maxHp); text = '+40 HP'; color = '#44ff44'; break;
    case 1: player.damage *= 1.15; text = '+15% DAÑO'; color = '#ff6644'; break;
    case 2: player.fireRate *= 0.9; text = '+10% VEL. ATAQUE'; color = '#44aaff'; break;
    case 3: xp += 8; text = '+8 XP'; color = '#b8a0ff'; break;
  }
  showFloatingText(chest.x, 1.5, chest.z, text, color);
  beep(660, 0.1, 'sine', 0.08, 880); setTimeout(()=>beep(880, 0.15, 'sine', 0.08, 1320), 80);
  if(xp >= xpNext){ xp -= xpNext; level++; xpNext = Math.floor(5 + level*12); triggerLevelUp(); }
  updateUI();
}

const floatingTexts = [];
function showFloatingText(x, y, z, text, color){
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const cx = c.getContext('2d'); cx.font = 'bold 42px Arial'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillStyle = color; cx.strokeStyle = '#000'; cx.lineWidth = 5; cx.strokeText(text, 128, 32); cx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c); const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false });
  const sprite = new THREE.Sprite(mat); sprite.position.set(x, y, z); sprite.scale.set(2.5, 0.6, 1); sprite.renderOrder = 1001;
  scene.add(sprite); floatingTexts.push({ sprite, mat, tex, life: 1.5, maxLife: 1.5, vy: 2 });
}

const projGeo = new THREE.SphereGeometry(0.28, 10, 8);
function spawnProjectile(x,z,dx,dz,dmg,pierce,enemyProj=false){
  let color = 0xffd93d;
  if(enemyProj) color = 0xff4466;
  else if(selectedChar.id === 'dragon') color = 0xff6622;
  else if(selectedChar.id === 'mage') color = 0x88ddff;
  else if(selectedChar.id === 'knight') color = 0xddeeff;
  const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.2, roughness:0.3, metalness:0.4 });
  const m = new THREE.Mesh(projGeo, mat); m.position.set(x, 1, z); projGroup.add(m);
  projectiles.push({ mesh:m, x, z, y:1, vx:dx, vz:dz, dmg, pierce, enemyProj, hitSet:new Set(), life: enemyProj ? 2.2 : 1.1, mat });
}
const gemGeo = new THREE.OctahedronGeometry(0.22);
function spawnGem(x,z,value,color=0x8a70ff){
  const mat = new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:0.8, metalness:0.5, roughness:0.2 });
  const m = new THREE.Mesh(gemGeo, mat); m.position.set(x, 0.4, z); gemGroup.add(m);
  gems.push({ mesh:m, mat, x, z, value, life:0, bob:rand(0,Math.PI*2) });
}
const particlePool = [];
function spawnBurst(x,y,z,color,count=10,speed=6){
  for(let i=0;i<count;i++){
    let p = particlePool.pop();
    if(!p){
      const g = new THREE.SphereGeometry(0.1, 6, 4); const m = new THREE.MeshBasicMaterial({ transparent:true });
      p = { mesh: new THREE.Mesh(g, m), alive:false }; partGroup.add(p.mesh);
    }
    p.mesh.material.color.set(color); p.mesh.material.opacity = 1; p.mesh.position.set(x, y, z);
    p.mesh.scale.setScalar(rand(0.5,1.5));
    const a = rand(0, Math.PI*2), s = rand(speed*0.3, speed);
    p.vx = Math.cos(a)*s; p.vy = rand(2,6); p.vz = Math.sin(a)*s;
    p.life = rand(0.4, 0.8); p.maxLife = p.life; p.alive = true; p.mesh.visible = true; particles.push(p);
  }
}

  for(const p of projectiles){ projGroup.remove(p.mesh); p.mat.dispose(); }
  projectiles = [];
  for(const g of gems){ gemGroup.remove(g.mesh); g.mat.dispose(); }
  gems = [];
  for(const c of chests){ chestGroup.remove(c.mesh); }
  chests = [];
  for(const p of particles){ p.alive=false; p.mesh.visible=false; particlePool.push(p); }
  particles = [];
  for(const ft of floatingTexts){ scene.remove(ft.sprite); ft.mat.dispose(); ft.tex.dispose(); }
  floatingTexts.length = 0;
  if(player){ scene.remove(player.mesh); scene.remove(player.healthBar.group); player = null; }
}

function startGame(){
  clearScene(); applyMapToScene(selectedMap); player = createPlayer(selectedChar);
  kills = 0; elapsed = 0; chestTimer = 5;
  level = 1; xp = 0; xpNext = 5;
  upgradeChoices = null; chestsOpened = 0;
  currentWave = 0;
  startNextWave();
  gameState = 'playing'; document.getElementById('overlay').classList.add('hidden'); updateUI();
}

function startNextWave(){
  currentWave++;
  isBossWave = (currentWave % 5 === 0);
  
  if(isBossWave){
    enemiesToSpawn = 1;
    showFloatingText(player.x, 3, player.z, '¡OLEADA DE JEFE!', '#ff3366');
    beep(150, 0.5, 'sawtooth', 0.1, 80);
  } else {
    enemiesToSpawn = Math.floor(selectedDiff.baseEnemies + (currentWave - 1) * selectedDiff.enemyInc);
    showFloatingText(player.x, 3, player.z, `OLEADA ${currentWave}`, '#ffd93d');
    beep(600, 0.2, 'sine', 0.08);
  }
  
  waveState = 'active';
  spawnTimer = 0;
  updateUI();
}

function waveCleared(){
  waveState = 'between';
  waveTimer = 3.0;
  
  player.hp = player.maxHp;
  updateUI();
  
  showFloatingText(player.x, 3, player.z, '¡OLEADA SUPERADA!', '#44ff44');
  showFloatingText(player.x, 2, player.z, 'VIDA RESTAURADA', '#44ff44');
  beep(600, 0.15, 'sine', 0.1);
  setTimeout(()=>beep(900, 0.15, 'sine', 0.1), 100);
  setTimeout(()=>beep(1200, 0.2, 'sine', 0.1), 200);

  document.getElementById('waveText').textContent = `OLEADA ${currentWave} COMPLETADA`;
  document.getElementById('waveText').style.color = '#44ff44';
}

function pickUpgrade(i){
  if(gameState !== 'levelup' || !upgradeChoices) return;
  const u = upgradeChoices[i]; if(!u) return;
  u.apply(player); upgradeChoices = null; gameState = 'playing';
  document.getElementById('overlay').classList.add('hidden'); beep(500,0.1,'sine',0.08); updateUI();
}

function triggerLevelUp(){
  gameState = 'levelup'; upgradeChoices = generateUpgrades();
  const ov = document.getElementById('overlay');
  let html = `<h1 style="font-size:32px">¡SUBE DE NIVEL!</h1><p>Nivel ${level} · Elige una mejora</p><div class="cards">`;
  upgradeChoices.forEach((u,i) => {
    html += `<div class="card" data-idx="${i}">
      <div class="name">${i+1}. ${u.name}</div>
      <div class="desc">${u.desc}</div>
      <div class="rar" style="color:${u.color}">${u.rarity}</div>
    </div>`;
  });
  html += '</div><div class="hint">Toca una tarjeta</div>';
  ov.innerHTML = html; ov.classList.remove('hidden');
  ov.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (ev) => { ev.stopPropagation(); pickUpgrade(parseInt(card.dataset.idx, 10)); });
  });
  beep(600,0.1,'sine',0.08); setTimeout(()=>beep(900,0.15,'sine',0.08),100);
}

function gameOver(){
  gameState = 'gameover';
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1 style="font-size:32px;background:linear-gradient(135deg,#f66,#fa6)">${selectedChar.icon} HAS CAÍDO</h1>
    <p>Llegaste a la: <strong style="color:#ffd93d">Oleada ${currentWave}</strong></p>
    <p>Mapa: <strong>${selectedMap.icon} ${selectedMap.name}</strong> · Dificultad: <strong>${selectedDiff.name}</strong></p>
    <p>Nivel: <strong style="color:#b8a0ff">${level}</strong> · Bajas: <strong style="color:#ffd93d">${kills}</strong> · Cofres: <strong style="color:#ffaa00">${chestsOpened}</strong></p>
    <button class="btnStart" id="btnRetry" style="margin-top:15px">🔄 REINTENTAR</button>
    <button class="btnStart" id="btnMenu" style="margin-top:8px;background:linear-gradient(135deg,#4a3a8a,#2a2450);color:#fff">🏠 MENÚ</button>
  `;
  ov.classList.remove('hidden');
  document.getElementById('btnRetry').addEventListener('click', (e) => { e.stopPropagation(); initAudio(); startGame(); });
  document.getElementById('btnMenu').addEventListener('click', (e) => { e.stopPropagation(); clearScene(); showMenu(); });
  beep(150,0.6,'sawtooth',0.12,60);
}

function updateUI(){
  document.getElementById('uiWave').textContent = currentWave;
  document.getElementById('uiLevel').textContent = level;
  document.getElementById('uiKills').textContent = kills;
  document.getElementById('uiChests').textContent = chestsOpened;
  
  if(gameState === 'playing'){
    document.getElementById('waveText').textContent = isBossWave ? '¡JEFE!' : `OLEADA ${currentWave}`;
    document.getElementById('waveText').style.color = isBossWave ? '#ff3366' : '#fff';
    
    if(waveState === 'active'){
      const left = enemies.filter(e => e.hp > 0).length + enemiesToSpawn;
      document.getElementById('enemiesLeft').textContent = `Enemigos restantes: ${left}`;
    } else if(waveState === 'between'){
      document.getElementById('enemiesLeft').textContent = 'Preparando siguiente oleada...';
    }
  }

  if(player){
    const ratio = player.hp / player.maxHp;
    document.getElementById('hpBar').style.width = (ratio*100)+'%';
    document.getElementById('hpText').textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;
  }
  document.getElementById('xpBar').style.width = (xp/xpNext*100)+'%';
  document.getElementById('xpText').textContent = `Nivel ${level} · ${Math.floor(xp)}/${xpNext} XP`;
}

function fireProjectiles(){
  const alive = enemies.filter(e => e.hp > 0); if(!alive.length) return;
  let target = alive[0], best = dist2(player, target);
  for(const e of alive){ const d = dist2(player,e); if(d < best){ best = d; target = e; } }
  if(Math.sqrt(best) > player.range) return;
  const baseAngle = Math.atan2(target.z - player.z, target.x - player.x);
  const spread = player.projCount > 1 ? 0.16 : 0;
  for(let i=0;i<player.projCount;i++){
    const offset = (i - (player.projCount-1)/2) * spread;
    const a = baseAngle + offset;
    spawnProjectile(player.x, player.z, Math.cos(a)*player.projSpeed, Math.sin(a)*player.projSpeed, player.damage, player.pierce, false);
  }
  const freq = selectedChar.id === 'dragon' ? 500 : selectedChar.id === 'mage' ? 850 : 700;
  beep(freq,0.035,'square',0.03,freq*1.4);
}

function killEnemy(e){
  kills++;
  spawnBurst(e.x, 1, e.z, e.isBoss ? 0xff3366 : selectedMap.enemyColors.grunt, e.isBoss ? 40 : 12, e.isBoss ? 12 : 6);
  if(e.isBoss){
    for(let k=0;k<12;k++) spawnGem(e.x + rand(-3,3), e.z + rand(-3,3), 5, 0xffa64d);
    beep(200,0.4,'sawtooth',0.1,80); showFloatingText(e.x, 3, e.z, '¡JEFE DERROTADO!', '#ffd93d'); spawnChest();
  } else {
    spawnGem(e.x, e.z, e.xp); beep(300,0.05,'square',0.03,400); if(Math.random() < 0.05) spawnChest();
  }
  enemyGroup.remove(e.mesh); if(e.healthBar) scene.remove(e.healthBar.group);
}

// ==================== INPUT ====================
const keys = {};
function onKeyDown(e){
  keys[e.key] = true;
  if(e.key === ' ' || e.key === 'Enter' || e.code === 'Space'){
    e.preventDefault(); initAudio();
    if(gameState === 'levelup') pickUpgrade(0);
  }
  if(gameState === 'levelup'){
    if(e.key === '1') pickUpgrade(0); if(e.key === '2') pickUpgrade(1); if(e.key === '3') pickUpgrade(2);
  }
}
function onKeyUp(e){ keys[e.key] = false; }
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);

const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) {
  joystickEl.style.display = 'block';
  document.getElementById('btnFullscreen').style.display = 'flex';
}

function updateJoystick(clientX, clientY) {
  const rect = joystickEl.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  let dx = clientX - centerX; let dy = clientY - centerY;
  const maxDist = rect.width / 2 - 20;
  const dist = Math.hypot(dx, dy);
  if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
  knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joystickVector.x = dx / maxDist;
  joystickVector.y = dy / maxDist;
}
joystickEl.addEventListener('touchstart', (e) => { e.preventDefault(); joystickActive = true; updateJoystick(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
joystickEl.addEventListener('touchmove', (e) => { e.preventDefault(); if (!joystickActive) return; updateJoystick(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
joystickEl.addEventListener('touchend', () => { joystickActive = false; joystickVector.x = 0; joystickVector.y = 0; knobEl.style.transform = 'translate(-50%, -50%)'; });

document.getElementById('btnFullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
  else if (document.exitFullscreen) document.exitFullscreen();
});

// ==================== UPDATE ====================
function update(dt){
  const t = performance.now()/1000;

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.life -= dt;
    if(p.life <= 0){ p.alive=false; p.mesh.visible=false; particlePool.push(p); particles.splice(i,1); continue; }
    p.vy -= 18 * dt; p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
    if(p.mesh.position.y < 0.1){ p.mesh.position.y = 0.1; p.vy *= -0.4; }
    p.mesh.material.opacity = clamp(p.life/p.maxLife, 0, 1); p.mesh.scale.multiplyScalar(0.97);
  }

  for(let i=floatingTexts.length-1;i>=0;i--){
    const ft = floatingTexts[i]; ft.life -= dt; ft.sprite.position.y += ft.vy * dt;
    ft.mat.opacity = clamp(ft.life / ft.maxLife, 0, 1);
    if(ft.life <= 0){ scene.remove(ft.sprite); ft.mat.dispose(); ft.tex.dispose(); floatingTexts.splice(i,1); }
  }

  for(const g of gems){ g.mesh.rotation.y += dt*3; g.mesh.position.y = 0.4 + Math.sin(t*3 + g.bob) * 0.1; }

  for(const c of chests){
    if(c.open){
      c.openTimer -= dt;
      if(c.openTimer > 0){ c.lid.rotation.x = Math.max(0, c.lid.rotation.x - dt*8); c.lid.position.z = -c.lid.rotation.x * 0.3; }
      c.glow.material.opacity = 0.4 * (1 - clamp((0.5 - c.openTimer)/0.5, 0, 1)); c.ring.material.opacity = 0.1;
    } else {
      c.mesh.rotation.y += dt * 0.5;
      c.glow.material.opacity = 0.15 + Math.sin(t*3 + c.bob) * 0.1;
      c.ring.material.opacity = 0.3 + Math.sin(t*3 + c.bob) * 0.2;
      c.ring.scale.setScalar(1 + Math.sin(t*3 + c.bob) * 0.1);
    }
  }

  if(gameState !== 'playing' || !player) return;

  let mx = joystickVector.x;
  let mz = joystickVector.y;
  if(keys['w']||keys['W']||keys['ArrowUp']) mz-=1;
  if(keys['s']||keys['S']||keys['ArrowDown']) mz+=1;
  if(keys['a']||keys['A']||keys['ArrowLeft']) mx-=1;
  if(keys['d']||keys['D']||keys['ArrowRight']) mx+=1;
  const len = Math.hypot(mx,mz);
  if(len>0.1){
    mx/=Math.max(1, len); mz/=Math.max(1, len);
    const moveSpeed = player.speed * Math.min(1, len);
    player.x += mx * moveSpeed * dt; player.z += mz * moveSpeed * dt;
    player.mesh.rotation.y = Math.atan2(mx, mz);
    player.walkPhase += dt * 12;
    player.mesh.position.y = Math.abs(Math.sin(player.walkPhase)) * 0.08;
  } else {
    player.mesh.position.y *= 0.9;
  }
  player.x = clamp(player.x, -ARENA+1, ARENA-1);
  player.z = clamp(player.z, -ARENA+1, ARENA-1);
  if(player.invuln > 0) player.invuln -= dt;

  player.aura.scale.setScalar(1 + Math.sin(t*4)*0.15);
  player.aura.material.opacity = 0.25 + Math.sin(t*4)*0.15;
  player.mesh.position.x = player.x; player.mesh.position.z = player.z;

  if(selectedChar.id === 'dragon'){
    if(player.mesh.userData.wingL && player.mesh.userData.wingR){
      const flap = Math.sin(t*6) * 0.3;
      player.mesh.userData.wingL.rotation.z = flap;
      player.mesh.userData.wingR.rotation.z = -flap;
    }
  } else if(selectedChar.id === 'mage'){
    if(player.mesh.userData.orb){
      player.mesh.userData.orb.position.y = 2.0 + Math.sin(t*3) * 0.08;
      player.mesh.userData.orb.material.emissiveIntensity = 1.2 + Math.sin(t*5) * 0.5;
    }
    if(player.mesh.userData.halo){
      player.mesh.userData.halo.scale.setScalar(1 + Math.sin(t*3) * 0.1);
      player.mesh.userData.halo.material.opacity = 0.2 + Math.sin(t*3) * 0.1;
    }
  }

  player.healthBar.group.position.set(player.x, 2.4 + player.mesh.position.y, player.z);
  player.healthBar.group.lookAt(camera.position);
  updateHealthBar(player.healthBar, player.hp / player.maxHp);

  camera.position.x += (player.x + CAM_OFFSET.x - camera.position.x) * Math.min(dt*6, 1);
  camera.position.y += (CAM_OFFSET.y - camera.position.y) * Math.min(dt*6, 1);
  camera.position.z += (player.z + CAM_OFFSET.z - camera.position.z) * Math.min(dt*6, 1);
  camera.lookAt(player.x, 0, player.z);

  player.fireCd -= dt;
  if(player.fireCd <= 0){ fireProjectiles(); player.fireCd = player.fireRate; }

  if(waveState === 'active'){
    spawnTimer -= dt;
    if(enemiesToSpawn > 0 && spawnTimer <= 0){
      if(isBossWave) spawnEnemy(true);
      else spawnEnemy(false);
      enemiesToSpawn--;
      const spawnInterval = Math.max(0.15, 0.8 - currentWave * 0.05);
      spawnTimer = spawnInterval;
    }
    if(enemiesToSpawn === 0 && enemies.filter(e=>e.hp>0).length === 0){
      waveCleared();
    }
  } else if(waveState === 'between'){
    waveTimer -= dt;
    if(waveTimer <= 0){
      startNextWave();
    }
  }

  chestTimer -= dt;
  if(chestTimer <= 0){ if(chests.filter(c=>!c.open).length < 2) spawnChest(); chestTimer = rand(10, 18); }
  for(let i=chests.length-1;i>=0;i--){
    const c = chests[i];
    if(c.open){ if(c.openTimer <= 0){ chestGroup.remove(c.mesh); chests.splice(i,1); } continue; }
    if(Math.hypot(c.x - player.x, c.z - player.z) < 1.2) openChest(c);
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.hp <= 0) continue;
    const dx = player.x - e.x, dz = player.z - e.z;
    const d = Math.hypot(dx,dz) || 1;
    e.x += (dx/d)*e.speed*dt; e.z += (dz/d)*e.speed*dt;
    e.bobPhase += dt*8;
    e.mesh.position.set(e.x, Math.abs(Math.sin(e.bobPhase)) * 0.06, e.z);
    e.mesh.rotation.y = Math.atan2(dx, dz);

    if(e.hitFlash > 0){ e.hitFlash -= dt; e.mesh.traverse(o => { if(o.isMesh && o.material && o.material.emissive) o.material.emissiveIntensity = 2; }); }
    else { e.mesh.traverse(o => { if(o.isMesh && o.material && o.material.emissive && o.material.emissive.getHex() !== 0) o.material.emissiveIntensity = 1; }); }

    if(e.healthBar){
      e.healthBar.group.position.set(e.x, e.isBoss ? 5.5 : 2.4, e.z);
      e.healthBar.group.lookAt(camera.position);
      updateHealthBar(e.healthBar, e.hp / e.maxHp);
    }

    if(e.isBoss){
      if(e.bossType === 'shaman'){
        e.teleportCd -= dt;
        if(e.teleportCd <= 0){
          e.teleportCd = 4.0;
          const ang = rand(0, Math.PI*2);
          e.x = player.x + Math.cos(ang) * 8;
          e.z = player.z + Math.sin(ang) * 8;
          spawnBurst(e.x, 1, e.z, 0xff00ff, 20, 8);
        }
        e.shootCd -= dt;
        if(e.shootCd <= 0){
          e.shootCd = 1.2; const base = Math.atan2(dz,dx);
          for(let k=-1;k<=1;k++){ const a = base + k*0.2; spawnProjectile(e.x, e.z, Math.cos(a)*16, Math.sin(a)*16, 15 * selectedDiff.dmgMult, 0, true); }
          beep(400,0.15,'triangle',0.08,200);
        }
      } else if(e.bossType === 'king'){
        e.shootCd -= dt;
        if(e.shootCd <= 0){
          e.shootCd = 1.8; const base = Math.atan2(dz,dx);
          for(let k=0;k<8;k++){ const a = base + (k-3.5)*0.35; spawnProjectile(e.x, e.z, Math.cos(a)*14, Math.sin(a)*14, 15 * selectedDiff.dmgMult, 0, true); }
          beep(300,0.15,'sawtooth',0.06,500);
        }
      }
    }

    if(e.type === 'shaman'){
      e.shootCd -= dt;
      if(e.shootCd <= 0 && d < 12){
        e.shootCd = 2.5; const base = Math.atan2(dz,dx);
        spawnProjectile(e.x, e.z, Math.cos(base)*10, Math.sin(base)*10, 8 * selectedDiff.dmgMult, 0, true);
        beep(450,0.1,'triangle',0.05,300);
      }
    }

    if(d < e.r + player.r && player.invuln <= 0){
      player.hp -= e.dmg; player.invuln = 0.6;
      spawnBurst(player.x, 1, player.z, 0xff4444, 8, 4);
      beep(200,0.12,'sawtooth',0.08,80);
      if(player.hp <= 0){ player.hp=0; updateUI(); gameOver(); return; }
    }
  }

  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.x += p.vx*dt; p.z += p.vz*dt; p.life -= dt;
    p.mesh.position.set(p.x, p.y, p.z);
    p.mat.emissiveIntensity = 1 + Math.sin(t*20)*0.3;

    if(p.life <= 0 || Math.abs(p.x) > ARENA+2 || Math.abs(p.z) > ARENA+2){
      projGroup.remove(p.mesh); p.mat.dispose(); projectiles.splice(i,1); continue;
    }

    if(p.enemyProj){
      if(dist2(p, player) < (0.28 + player.r)**2 && player.invuln <= 0){
        player.hp -= p.dmg; player.invuln = 0.3;
        spawnBurst(player.x, 1, player.z, 0xff4444, 6, 3);
        projGroup.remove(p.mesh); p.mat.dispose(); projectiles.splice(i,1);
        beep(220,0.08,'sawtooth',0.06);
        if(player.hp <= 0){ player.hp=0; updateUI(); gameOver(); return; }
      }
    } else {
      for(const e of enemies){
        if(e.hp <= 0 || p.hitSet.has(e)) continue;
        if(dist2(p, e) < (e.r + 0.28)**2){
          e.hp -= p.dmg; e.hitFlash = 0.12; p.hitSet.add(e);
          spawnBurst(e.x, 1, e.z, 0xffd93d, 4, 3);
          if(e.hp <= 0) killEnemy(e);
          if(p.pierce > 0){ p.pierce--; }
          else { projGroup.remove(p.mesh); p.mat.dispose(); projectiles.splice(i,1); break; }
        }
      }
    }
  }

  for(let i=gems.length-1;i>=0;i--){
    const g = gems[i];
    const d = Math.hypot(player.x-g.x, player.z-g.z);
    if(d < player.magnet){
      const dx = player.x-g.x, dz=player.z-g.z, dd=Math.hypot(dx,dz)||1;
      g.x += (dx/dd)*20*dt; g.z += (dz/dd)*20*dt;
    }
    g.life += dt;
    if(d < 0.7){
      xp += g.value; gemGroup.remove(g.mesh); g.mat.dispose(); gems.splice(i,1);
      beep(900,0.035,'sine',0.04);
      if(xp >= xpNext){ xp -= xpNext; level++; xpNext = Math.floor(5 + level*12); updateUI(); triggerLevelUp(); return; }
      updateUI();
    }
  }

  updateUI();
}

const CAM_OFFSET = new THREE.Vector3(0, 22, 16);
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;
  try { update(dt); } catch(err) { console.error(err); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

initThree();
showMenu();
requestAnimationFrame(loop);

console.log('[BONK] Hardcore Waves cargado.');
</script>
